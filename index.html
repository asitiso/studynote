<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모든암기장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3C3489">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모든암기장">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --ink:#2B2A27;
    --sub:#8A8780;
    --line:#EBE8E0;
    --accent:#3C3489;
    --accent-soft:#EEEDFE;
    --good:#0F6E56;
    --good-soft:#E1F5EE;
    --bad:#993C1D;
    --bad-soft:#FAECE7;
    --warn:#854F0B;
    --warn-soft:#FAEEDA;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
    height:100%;overscroll-behavior:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* 공통 */
  .screen{flex:1;display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;border:none;background:none;color:inherit;}
  input,textarea{font-family:inherit;}

  /* 상단바 */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;}
  .topbar .title{font-size:19px;font-weight:700;color:var(--ink);}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sub);}
  .icon-btn:active{background:var(--line);}

  /* 홈: 암기장 목록 */
  .deck-list{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .deck-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
  .deck-card .left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .deck-name{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .deck-meta{font-size:13px;color:var(--sub);}

  .group-header{border:none;border-radius:18px;padding:18px 20px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .group-header:active{transform:scale(0.97);}
  .group-header .g-emoji{font-size:26px;flex-shrink:0;}
  .group-header .g-title{font-weight:800;font-size:19px;}
  .group-header .g-count{font-size:14px;font-weight:600;opacity:.75;}
  .group-header .g-chevron{font-size:16px;display:inline-block;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1);}
  .group-header .g-due{font-size:13px;font-weight:800;padding:6px 12px;border-radius:14px;
    background:rgba(255,255,255,.6);}
  .deck-badge{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:6px 12px;border-radius:20px;min-width:44px;text-align:center;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
  .empty-state .big{font-size:44px;margin-bottom:12px;}
  .empty-state .msg{font-size:15px;line-height:1.6;}

  .fab{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 40px));
    display:flex;gap:10px;z-index:50;}
  .fab button{flex:1;height:56px;border-radius:18px;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .fab .primary{background:var(--accent);color:#fff;}
  .fab .secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .fab-spacer{height:90px;}

  /* 카드 뷰포트(학습화면) */
  .study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .study-deck-name{font-size:14px;color:var(--sub);font-weight:500;}
  .study-count{font-size:14px;font-weight:700;color:var(--ink);}
  .progress-track{height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .25s ease;}

  .card-stage{flex:1;display:flex;flex-direction:column;min-height:0;}
  .flash-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;min-height:320px;position:relative;transition:transform .18s ease, opacity .18s ease;}
  .flash-card.flip-out{opacity:0;transform:scale(.96);}
  .card-term{font-size:38px;font-weight:800;color:var(--ink);line-height:1.3;word-break:keep-all;}
  .card-meaning{font-size:19px;color:var(--sub);margin-top:18px;line-height:1.6;word-break:keep-all;}
  .tap-hint{position:absolute;bottom:22px;font-size:13px;color:var(--sub);opacity:.7;}
  .wrong-tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;color:var(--warn);
    background:var(--warn-soft);padding:5px 10px;border-radius:20px;}

  .answer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .answer-row button{height:58px;border-radius:18px;font-size:17px;font-weight:700;border:1.5px solid;}
  .btn-no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);}
  .btn-yes{border-color:var(--good);color:var(--good);background:var(--good-soft);}
  .answer-row button:active{transform:scale(.97);}

  /* 4지선다 */
  .quiz-q{font-size:15px;color:var(--sub);margin-bottom:10px;font-weight:500;}
  .quiz-term{font-size:30px;font-weight:800;color:var(--ink);text-align:center;margin:26px 0 30px;word-break:keep-all;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-options.grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .quiz-opt.big-char{display:flex;align-items:center;justify-content:center;
    font-size:48px;font-weight:800;padding:28px 8px;text-align:center;min-height:100px;}
  .quiz-opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:16px 18px;font-size:16px;font-weight:600;text-align:left;color:var(--ink);}
  .quiz-opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);}
  .quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
  .quiz-opt:disabled{opacity:1;}

  /* 스펠링 입력 */
  .spell-meaning{font-size:22px;font-weight:700;color:var(--ink);text-align:center;margin:30px 0 26px;word-break:keep-all;}
  .spell-input{width:100%;height:60px;border:1.5px solid var(--line);border-radius:16px;
    font-size:22px;text-align:center;font-weight:700;padding:0 16px;background:var(--card);color:var(--ink);}
  .spell-input:focus{outline:none;border-color:var(--accent);}
  .spell-input.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);}
  .spell-input.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
  .spell-answer{text-align:center;font-size:15px;color:var(--sub);margin-top:14px;min-height:20px;}
  .spell-submit{margin-top:18px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;}

  /* 완료 화면 */
  .done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .done-emoji{font-size:56px;margin-bottom:16px;}
  .done-title{font-size:22px;font-weight:800;margin-bottom:8px;}
  .done-sub{font-size:15px;color:var(--sub);margin-bottom:32px;}
  .done-stats{display:flex;gap:12px;margin-bottom:32px;}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 22px;min-width:90px;}
  .stat-num{font-size:24px;font-weight:800;}
  .stat-label{font-size:12px;color:var(--sub);margin-top:4px;}
  .done-btn{width:100%;max-width:280px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;}

  /* 단어 추가 화면 */
  .form-group{margin-bottom:18px;}
  .form-label{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;display:block;}
  .form-input,.form-textarea,.form-select{width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:16px;color:var(--ink);background:var(--card);}
  .form-textarea{min-height:160px;resize:vertical;line-height:1.6;}
  .form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--accent);}
  .form-hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5;}

  .method-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .method-tab{flex:1;padding:12px 10px;border-radius:14px;border:1.5px solid var(--line);
    text-align:center;font-size:14px;font-weight:700;color:var(--sub);}
  .method-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .camera-zone{border:2px dashed var(--line);border-radius:20px;padding:40px 20px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;}
  .camera-zone .cam-icon{font-size:44px;}
  .camera-zone .cam-text{font-size:15px;color:var(--sub);line-height:1.6;}
  .cam-btn{background:var(--accent);color:#fff;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:700;}

  .preview-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .preview-item{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .preview-item input{border:none;background:transparent;font-size:15px;color:var(--ink);width:100%;padding:4px 0;}
  .preview-item input:focus{outline:none;}
  .preview-item .term-input{font-weight:700;flex:1;}
  .preview-item .meaning-input{flex:1;color:var(--sub);}
  .preview-del{color:var(--bad);font-size:20px;padding:4px 8px;flex-shrink:0;}

  .submit-bar{position:sticky;bottom:0;background:var(--bg);padding-top:14px;}
  .submit-btn{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;}
  .submit-btn:disabled{opacity:.4;}

  /* 단어 목록/편집 */
  .search-bar{margin-bottom:14px;}
  .word-row{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
    transition:transform .15s ease;}
  .word-row.swiping{transform:translateX(-70px);}
  .word-row .wt{font-weight:700;font-size:16px;}
  .word-row .wm{font-size:14px;color:var(--sub);margin-top:3px;}
  .word-del-bg{color:#fff;font-size:14px;font-weight:700;}

  .loading-overlay{position:fixed;inset:0;background:rgba(250,249,246,.92);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 색종이 효과 (완료 화면) */
  .confetti-piece{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;
    animation:confetti-fall 1.5s ease-in forwards;}
  @keyframes confetti-fall{
    to{ transform:translateY(420px) rotate(360deg); opacity:0; }
  }

  /* 정답/오답 반응 애니메이션 */
  @keyframes pop-correct{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake-wrong{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  .pop-correct{animation:pop-correct .3s ease;}
  .shake-wrong{animation:shake-wrong .3s ease;}
  .loading-text{font-size:14px;color:var(--sub);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .back-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .back-btn{font-size:15px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 1. 홈: 암기장 목록 ===== -->
  <div id="screen-home" class="screen">
    <div class="topbar">
      <span class="title">모든암기장</span>
    </div>
    <input type="text" id="deck-search" placeholder="🔍 암기장 검색" oninput="onDeckSearchInput()"
      style="width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px;
      background:var(--card);color:var(--ink);margin-bottom:14px;">
    <div id="deck-list" class="deck-list"></div>
    <div class="fab-spacer"></div>
  </div>

  <!-- ===== 2. 암기장 상세(단어 목록) ===== -->
  <div id="screen-deck" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="goHome()">‹ 목록</button>
    </div>
    <div class="topbar" style="padding-left:0;padding-right:0;">
      <span class="title" id="deck-title"></span>
      <div style="display:flex;gap:4px;">
        <button class="icon-btn" id="listen-entry-btn">🎧</button>
        <button class="icon-btn" onclick="renameDeck()">✎</button>
        <button class="icon-btn" onclick="openDeleteDeck()">🗑</button>
      </div>
    </div>
    <div id="deck-session-info"></div>
    <div id="deck-stats" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;"></div>
    <div id="word-list"></div>
    <div class="fab-spacer"></div>
  </div>

  <!-- ===== 3. 학습(카드) 화면 ===== -->
  <div id="screen-study" class="screen hidden">
    <div class="back-row" style="justify-content:space-between;">
      <button class="back-btn" onclick="exitStudy()">‹ 그만하기</button>
      <button class="icon-btn" id="sound-toggle-btn" onclick="toggleSound()" style="color:var(--sub);">🔊</button>
    </div>
    <div class="study-top">
      <span class="study-deck-name" id="study-deck-name"></span>
      <span class="study-count" id="study-count"></span>
    </div>
    <div id="phase-label" style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="card-stage" id="stage-card">
      <div class="flash-card" id="flash-card">
        <span class="wrong-tag hidden" id="wrong-tag">다시 복습</span>
        <button id="speak-btn" onclick="speakCurrentTerm(event)" style="position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--sub);">🔊</button>
        <div class="card-term" id="card-term"></div>
        <div class="card-meaning hidden" id="card-meaning"></div>
        <div class="tap-hint" id="tap-hint">탭해서 뜻 보기</div>
      </div>
      <div class="answer-row hidden" id="answer-row">
        <button class="btn-no" onclick="answerCard(false)">모름</button>
        <button class="btn-yes" onclick="answerCard(true)">알아요</button>
      </div>
    </div>

    <!-- 4지선다 -->
    <div class="card-stage hidden" id="stage-quiz">
      <div class="quiz-q" id="quiz-q"></div>
      <div class="quiz-term" id="quiz-term"></div>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <!-- 스펠링 입력 -->
    <div class="card-stage hidden" id="stage-spell">
      <div class="quiz-q">뜻을 보고 단어를 입력하세요</div>
      <div class="spell-meaning" id="spell-meaning"></div>
      <input class="spell-input" id="spell-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력">
      <div class="spell-answer" id="spell-answer"></div>
      <button id="spell-speak-btn" onclick="speakCurrentTerm(event)" class="hidden" style="display:block;margin:6px auto 0;background:transparent;color:var(--accent);font-size:14px;font-weight:600;">🔊 발음 듣기</button>
      <button class="spell-submit" id="spell-submit" onclick="submitSpell()">확인</button>
      <button id="spell-idk" onclick="giveUpSpell()" style="width:100%;height:48px;margin-top:10px;border-radius:14px;font-size:15px;font-weight:600;color:var(--sub);background:transparent;border:1.5px solid var(--line);">잘 모르겠어요</button>
    </div>
  </div>

  <!-- ===== 3-1. 듣기 모드 (차에서 손 안 대고 듣기) ===== -->
  <div id="screen-listen" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="exitListen()">‹ 그만듣기</button>
    </div>
    <div class="study-top">
      <span class="study-deck-name" id="listen-deck-name"></span>
      <span class="study-count" id="listen-count"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="listen-progress-fill" style="width:0%"></div></div>
    <div class="card-stage">
      <div class="flash-card" id="listen-card" style="cursor:default;">
        <div class="card-term" id="listen-term"></div>
        <div class="card-meaning" id="listen-meaning"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button onclick="listenPrev()" style="flex:1;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:20px;">⏮</button>
        <button id="listen-play-btn" onclick="toggleListenPlay()" style="flex:2;height:56px;border-radius:18px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;">⏸ 일시정지</button>
        <button onclick="listenNext()" style="flex:1;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:20px;">⏭</button>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--sub);margin-top:14px;">화면을 꺼도 계속 재생돼요 (기기에 따라 다를 수 있어요)</div>
    </div>
  </div>

  <!-- ===== 4. 완료 화면 ===== -->
  <div id="screen-done" class="screen hidden" style="position:relative;overflow:hidden;">
    <div id="confetti-wrap" style="position:absolute;inset:0;pointer-events:none;"></div>
    <div class="done-wrap">
      <div class="done-emoji" id="done-emoji">🎉</div>
      <div class="done-title" id="done-title">오늘 학습 완료!</div>
      <div class="done-sub" id="done-sub"></div>
      <div class="done-stats">
        <div class="stat-box"><div class="stat-num" id="done-total" style="color:var(--accent);">0</div><div class="stat-label">학습한 단어</div></div>
        <div class="stat-box"><div class="stat-num" id="done-correct" style="color:var(--good);">0</div><div class="stat-label">맞춘 개수</div></div>
      </div>
      <button class="done-btn" onclick="goHome()">암기장 목록으로</button>
    </div>
  </div>

  <!-- ===== 5. 단어 추가 화면 ===== -->
  <div id="screen-add" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="goBackFromAdd()">‹ 취소</button>
    </div>
    <span class="title" id="add-title" style="margin-bottom:16px;display:block;">단어 추가</span>

    <div class="method-tabs">
      <div class="method-tab active" id="tab-photo" onclick="switchAddTab('photo')">📷 사진으로</div>
      <div class="method-tab" id="tab-text" onclick="switchAddTab('text')">✏️ 직접 입력</div>
    </div>

    <!-- 사진 방식 -->
    <div id="add-photo" >
      <div class="camera-zone" id="camera-zone">
        <div class="cam-icon">📷</div>
        <div class="cam-text">숙제나 교재를 촬영하면<br>AI가 자동으로 단어를 인식해요<br>여러 페이지는 "여러 장 선택"을 이용하세요</div>
        <div style="display:flex;gap:10px;">

function decksCol(){ return collection(db, 'vocab'); }
function wordsCol(deckId){ return collection(db, 'vocab', deckId, 'words'); }

// ================== 암기장 목록 ==================
async function loadDecks(){
  loading(true, '불러오는 중...');
  try{
    await loadStarterDecks(); // 기본 자료 JSON은 Firestore 로딩과 별개로 항상 시도
    const snap = await getDocs(decksCol());
    decks = [];
    snap.forEach(d=>decks.push({ id:d.id, ...d.data() }));
    // 단어 개수 세기 (암기장마다 순서대로 X, 한꺼번에 동시에 O) + 오답노트용 캐시
    await Promise.all(decks.map(async (dk)=>{
      const wsnap = await getDocs(wordsCol(dk.id));
      const wordsArr = [];
      wsnap.forEach(w=>wordsArr.push({ id:w.id, ...w.data() }));
      deckWordsCache[dk.id] = wordsArr;
      dk.wordCount = wordsArr.length;
      const now = Date.now();
      dk.dueCount = wordsArr.filter(w=> !w.nextReview || w.nextReview <= now).length;
      dk.wrongCount = wordsArr.filter(w=> (w.wrongStreak||0) >= 2).length;
    }));
    globalWrongCount = decks.reduce((s,d)=>s+(d.wrongCount||0), 0);
    decks.sort((a,b)=>{
      const ao = (a.order!==undefined) ? a.order : (a.createdAt||0);
      const bo = (b.order!==undefined) ? b.order : (b.createdAt||0);
      return ao - bo;
    });
    renderDeckList();
  }catch(e){
    console.error(e);
    decks = [];
    renderDeckList();
    showLoadError(e);
  }
  loading(false);
}

}

let STARTER_INDEX = null;     // [{name, count, file}] - 가벼운 목록만
let starterLoadFailed = false;
let starterGroupCache = {};   // 그룹파일(예: starter-hanja.json)별 캐시 - 한 번 받으면 재사용

async function loadStarterDecks(){
  if(STARTER_INDEX !== null || starterLoadFailed) return;
  try{
    const res = await fetch('starter-index.json'); // 이름·개수만 담은 가벼운 목록 (몇 KB)
    if(!res.ok) throw new Error('HTTP ' + res.status);
    STARTER_INDEX = await res.json();
  }catch(e){
    console.warn('기본 자료 목록 로드 실패', e);
    starterLoadFailed = true;
    STARTER_INDEX = [];
  }
}

async function loadStarterGroupFile(file){
  if(starterGroupCache[file]) return starterGroupCache[file];
  const res = await fetch(file);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  starterGroupCache[file] = data;
  return data;
}

window.addStarterDeck = async function(idx){
  const st = STARTER_INDEX[idx];
  if(!st) return;
  if(!confirm(`"${st.name}" (${st.count}개 카드)를 추가할까요?`)) return;
  loading(true, '기본 자료 추가 중...');
  try{
    const groupData = await loadStarterGroupFile(st.file); // 실제 단어 내용은 이때 처음 받아옴
    const full = groupData.find(d=>d.name === st.name);
    if(!full) throw new Error('자료를 찾을 수 없어요');

    const dref = doc(decksCol());
    const maxOrder = decks.reduce((m,d)=>Math.max(m, d.order!==undefined?d.order:0), 0);
    await setDoc(dref, { name: full.name, createdAt: Date.now(), order: maxOrder + 1 });
    const batch = writeBatch(db);
    for(const [term, meaning] of full.words){
      const wref = doc(wordsCol(dref.id));
      batch.set(wref, { term, meaning, createdAt: Date.now(), interval:0, ease:2.3, nextReview:0, wrongStreak:0 });
    }
    await batch.commit();
    loading(false);
    toast('추가 완료');
    goHome();
  }catch(e){ console.error(e); loading(false); toast('추가 실패'); }
};

function renderDeckList(){
  const wrap = $('deck-list');
  if(decks.length===0){
    wrap.innerHTML = `<div class="empty-state">

      <div class="msg">아직 암기장이 없어요.<br>아래 버튼으로 첫 암기장을 만들거나,<br>기본 자료로 시작해보세요.</div>

function setupDragReorder(){
  const wrap = $('deck-list');
  let dragEl = null;      // 실제로 옮겨지는 원본 DOM 요소
  let startY = 0;
  let placeholder = null;
  let dragging = false;

  const handles = wrap.querySelectorAll('.drag-handle');
  handles.forEach(handle=>{
    handle.onpointerdown = (e)=>{
      e.preventDefault();
      dragEl = handle.closest('.deck-card');
      if(!dragEl) return;
      dragging = true;
      startY = e.clientY;
      const rect = dragEl.getBoundingClientRect();
      placeholder = document.createElement('div');
      placeholder.style.height = rect.height + 'px';
      placeholder.style.margin = getComputedStyle(dragEl).margin;
      placeholder.style.border = '2px dashed var(--line)';
      placeholder.style.borderRadius = '16px';
      dragEl.parentNode.insertBefore(placeholder, dragEl.nextSibling);
      dragEl.style.position = 'fixed';
      dragEl.style.left = rect.left + 'px';
      dragEl.style.top = rect.top + 'px';
      dragEl.style.width = rect.width + 'px';
      dragEl.style.zIndex = 1000;
      dragEl.style.boxShadow = '0 8px 24px rgba(0,0,0,0.18)';
      dragEl.style.pointerEvents = 'none';
      document.body.appendChild(dragEl);

      const onMove = (ev)=>{
        if(!dragging) return;
        const dy = ev.clientY - startY;
        dragEl.style.top = (rect.top + dy) + 'px';
        // 현재 포인터 위치 기준으로 어느 카드 위에 있는지 찾기
        const cards = Array.from(wrap.querySelectorAll('.deck-card'));
        for(const card of cards){
          const r = card.getBoundingClientRect();
          const mid = r.top + r.height/2;
          if(ev.clientY < mid){
            card.parentNode.insertBefore(placeholder, card);
            return;
          }
        }
        wrap.appendChild(placeholder);
      };
      const onUp = ()=>{
        if(!dragging) return;
        dragging = false;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        placeholder.parentNode.insertBefore(dragEl, placeholder);
        placeholder.remove();
        dragEl.style.position = '';
        dragEl.style.left = '';
        dragEl.style.top = '';
        dragEl.style.width = '';
        dragEl.style.zIndex = '';
        dragEl.style.boxShadow = '';
        dragEl.style.pointerEvents = '';
        persistDeckOrder();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };
  });
}

async function persistDeckOrder(){
  const wrap = $('deck-list');
  const ids = Array.from(wrap.querySelectorAll('.deck-card')).map(el=>el.getAttribute('data-deck-id'));
  try{
    const batch = writeBatch(db);
    ids.forEach((id, idx)=>{
      const dk = decks.find(d=>d.id===id);
      if(dk) dk.order = idx;
      batch.update(doc(decksCol(), id), { order: idx });
    });
    await batch.commit();
    decks.sort((a,b)=>{
      const ao = (a.order!==undefined) ? a.order : (a.createdAt||0);
      const bo = (b.order!==undefined) ? b.order : (b.createdAt||0);
      return ao - bo;
    });
  }catch(e){ console.error('순서 저장 실패', e); }
}

function isToday(ts){
  if(!ts) return false;
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function renderDeckStats(){

  if(currentWords.length===0){ el.innerHTML=''; return; }
  const now = Date.now();
  const dueTotal = currentWords.filter(w=> !w.nextReview || w.nextReview <= now).length;
  const due = Math.min(dueTotal, getDailyLimit(currentWords.length)); // "학습 시작"의 하루 상한(20~50)에 맞춤
  const doneToday = currentWords.filter(w=> isToday(w.lastReviewed)).length;
  const mastered = currentWords.filter(w=> (w.interval||0) >= 35).length;
  const struggling = currentWords.filter(w=> (w.wrongStreak||0) >= 2);

  const chip = (label, num, color, soft, onclick)=>`
    <div ${onclick ? `onclick="${onclick}"` : ''} style="flex:1;min-width:64px;background:${soft};border-radius:14px;padding:10px 6px;text-align:center;${onclick?'cursor:pointer;':''}">
      <div style="font-size:17px;font-weight:800;color:${color};">${num}</div>
      <div style="font-size:10.5px;color:${color};font-weight:600;white-space:nowrap;">${label}</div>
    </div>`;

  el.innerHTML =
    chip('전체', currentWords.length, 'var(--ink)', 'var(--card)') +
    chip('오늘 학습', doneToday, 'var(--good)', 'var(--good-soft)') +

      : chip('자주틀림', 0, 'var(--sub)', 'var(--card)'));
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function extractFromImages(files){
  loading(true, files.length>1 ? `AI가 사진 ${files.length}장을 인식하는 중...` : 'AI가 단어를 인식하는 중...');
  const prompt = `이 이미지는 학생의 영어 단어 숙제 또는 학습 자료입니다. 이미지가 여러 장 주어질 수 있으며, 모든 이미지를 함께 확인해 "단어(또는 개념)"와 "뜻(또는 설명)" 쌍을 전부 찾아 하나의 JSON 배열로만 반환하세요.
다른 설명, 마크다운, 코드블록 표시 없이 순수 JSON 배열만 출력하세요.
형식 예시: [{"term":"achieve","meaning":"이루다, 성취하다"},{"term":"consider","meaning":"고려하다"}]
읽기 어려운 글자는 문맥상 가장 자연스러운 단어로 추정해서 채우세요.`;

  try{
    const parts = [{ text: prompt }];
    for(const file of files){
      const base64 = await fileToBase64(file);
      parts.push({ inline_data: { mime_type: file.type || 'image/jpeg', data: base64 } });
    }
    const result = await callGemini(parts);
    const items = parseJsonArray(result);
    if(!items || items.length===0){
      loading(false);
      toast('단어를 찾지 못했어요. 다시 촬영해보세요.');
      return;
    }
    const newItems = items.map(it=>({ id: uid(), term: (it.term||'').trim(), meaning: (it.meaning||'').trim() }))
      .filter(it=>it.term && it.meaning);
    pendingPreview = pendingPreview.concat(newItems); // 기존 미리보기 목록에 이어붙임 (덮어쓰지 않음)
    loading(false);
    renderPreview();
    toast(`${newItems.length}개 인식됨 (전체 ${pendingPreview.length}개)`);
  }catch(e){
    console.error(e);
    loading(false);
    toast('인식 실패. 다시 시도해주세요.');
  }
}

window.parseTextInput = function(){
  const raw = $('text-input').value.trim();
  if(!raw){ toast('내용을 입력하세요'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  for(const line of lines){
    let term, meaning;
    if(line.includes(',')){
      const idx = line.indexOf(',');
      term = line.slice(0,idx).trim();
      meaning = line.slice(idx+1).trim();
    } else {
      const idx = line.indexOf(' ');
      if(idx===-1) continue;
      term = line.slice(0,idx).trim();
      meaning = line.slice(idx+1).trim();
    }
    if(term && meaning) items.push({ id: uid(), term, meaning });
  }
  if(items.length===0){ toast('형식을 확인해주세요 (단어, 뜻)'); return; }
  pendingPreview = pendingPreview.concat(items); // 기존 미리보기 목록에 이어붙임 (덮어쓰지 않음)
  $('text-input').value = '';
  renderPreview();
  toast(`${items.length}개 추출됨 (전체 ${pendingPreview.length}개)`);
};

window.saveWords = async function(){
  const valid = pendingPreview.filter(p=>p.term.trim() && p.meaning.trim());
  if(valid.length===0){ toast('저장할 단어가 없어요'); return; }

  // 이미 암기장에 있는 단어, 그리고 이번 배치 안의 중복은 자동으로 제외
  const existingTerms = new Set(currentWords.map(w=>w.term.trim().toLowerCase()));
  const seenInBatch = new Set();
  const toSave = [];
  let dupCount = 0;
  for(const it of valid){
    const key = it.term.trim().toLowerCase();
    if(existingTerms.has(key) || seenInBatch.has(key)){
      dupCount++;
      continue;
    }
    seenInBatch.add(key);
    toSave.push(it);
  }
  if(toSave.length===0){
    toast('전부 이미 있는 단어예요');
    return;
  }

  loading(true, '저장하는 중...');
  try{
    const batch = writeBatch(db);
    for(const it of toSave){
      const ref = doc(wordsCol(addTargetDeckId));
      batch.set(ref, {
        term: it.term.trim(),
        meaning: it.meaning.trim(),
        createdAt: Date.now(),
        interval: 0,
        ease: 2.3,
        nextReview: 0,
        wrongStreak: 0
      });
    }
    await batch.commit();
    loading(false);
    toast(dupCount>0 ? `${toSave.length}개 저장 완료 (중복 ${dupCount}개 제외)` : `${toSave.length}개 저장 완료`);
    pendingPreview = [];
    openDeck(addTargetDeckId);
  }catch(e){
    console.error(e); loading(false); toast('저장 실패');
  }
};

// ================== 간격반복(SM-2 간소화) ==================
// wrongStreak 기반 + 간단 간격: 0 -> 1일 -> 3일 -> 7일 -> 16일 -> 35일 ...
const INTERVALS = [0, 1, 3, 7, 16, 35, 60]; // days

function nextIntervalDays(currentIdx, correct){
  if(correct){
    const idx = Math.min(currentIdx+1, INTERVALS.length-1);
    return { idx, days: INTERVALS[idx] };
  } else {
    return { idx: 0, days: INTERVALS[0] };
  }
}

window.startStudy = async function(deckId){
  currentDeckId = deckId;
  isGlobalSession = false;
  const dk = decks.find(d=>d.id===deckId);
  const hanja = deckIsHanja(deckId);
  const session = getResumableSession(deckId);

  isReviewRound = false;
  wrongIds = new Set();

  let useResume = false;
  if(session){
    useResume = confirm(`저번에 ${session.idx}/${(session.phaseQueueIds||session.queueIds).length}개까지 학습했어요.\n\n확인: 이어서 하기\n취소: 처음부터 시작`);
  }

  if(useResume){
    const rebuiltQueue = (session.queueIds||[]).map(id=>currentWords.find(w=>w.id===id)).filter(Boolean);
    const rebuiltPhaseQueue = (session.phaseQueueIds||session.queueIds||[]).map(id=>currentWords.find(w=>w.id===id)).filter(Boolean);
    if(rebuiltQueue.length > 0 && rebuiltPhaseQueue.length > 0){
      studyQueue = rebuiltQueue;
      phaseOrder = session.phaseOrder || ['flip','quiz','spell'];
      phaseIndex = session.phaseIndex || 0;
      phaseQueue = rebuiltPhaseQueue;
      studyIdx = Math.min(session.idx, phaseQueue.length);
      studyStats = session.stats || { total: 0, correct: 0 };
      wrongIds = new Set(session.wrongIds || []);
      isReviewRound = !!session.isReviewRound;
    } else {
      useResume = false; // 저장된 단어가 모두 삭제된 경우 새로 시작
    }
  }

  if(!useResume){
    if(session) await clearSession();
    const now = Date.now();
    const dailyLimit = getDailyLimit(currentWords.length);
    // 복습 대상 우선, 부족하면 새 단어로 채움 (뽑는 순서도 랜덤으로 섞음)
    const due = shuffle(currentWords.filter(w=> !w.nextReview || w.nextReview <= now));
    const notDue = shuffle(currentWords.filter(w=> w.nextReview && w.nextReview > now));
    let queue = due.slice(0, dailyLimit);
    if(queue.length < dailyLimit){
      queue = queue.concat(notDue.slice(0, dailyLimit - queue.length));
    }
    if(queue.length===0){
      toast('학습할 단어가 없어요');
      return;
    }
    studyQueue = queue.map(w=>({...w}));
    phaseOrder = ['flip','quiz','quizRev','spell'];
    phaseIndex = 0;
    phaseQueue = shuffle(studyQueue.map(w=>({...w})));
    studyIdx = 0;
    studyStats = { total: 0, correct: 0 };
  }

  // 카드마다 출처(한자 여부/암기장 id) 태깅 - 오답모음처럼 여러 암기장이 섞이는 세션 대비
  studyQueue.forEach(w=>{ w._isHanja = hanja; w._deckId = deckId; });
  phaseQueue.forEach(w=>{ w._isHanja = hanja; w._deckId = deckId; });

  $('study-deck-name').textContent = dk ? dk.name : '';
  showScreen('screen-study');

  showCard();

let soundEnabled = (typeof localStorage !== 'undefined' && localStorage.getItem('allmemo_sound') === 'off') ? false : true;
let audioCtx = null;

function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startTime, duration, gainPeak){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.02);
  gain.gain.linearRampToValueAtTime(0, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playCorrectSound(){
  if(!soundEnabled) return;
  playTone(880, 0, 0.12, 0.12);
  playTone(1174, 0.1, 0.15, 0.12);
}

function playWrongSound(){
  if(!soundEnabled) return;
  playTone(220, 0, 0.22, 0.1);
}

function playCheerSound(){
  if(!soundEnabled) return;
  playTone(523, 0, 0.13, 0.12);
  playTone(659, 0.12, 0.13, 0.12);
  playTone(784, 0.24, 0.24, 0.14);
}

let listenQueue = [];
let listenIdx = 0;
let listenPlaying = false;
let listenDeckId = null;

function getReadableMeaning(meaning){
  // "품사. 뜻 — 예문..." 또는 "훈음 (부수) — 설명" 형태에서 영어 예문 없이 한국어 뜻 부분만 추림
  let m = (meaning||'').split(' — ')[0];
  m = m.split(' 예:')[0];
  return m.trim();
}

function getListenMeaning(meaning){
  // 듣기 모드에서는 "동사./명사./형용사." 같은 품사 표시까지 빼고 뜻만 읽음
  let m = getReadableMeaning(meaning);
  m = m.replace(/^[가-힣]+\.\s*/, '');
  return m.trim();
}

function updateListenDisplay(i){
  const card = listenQueue[i];
  if(!card) return;
  const hanja = deckIsHanja(listenDeckId);
  const termText = hanja ? extractReading(card.meaning) : card.term;
  const meaningText = hanja ? card.term : getListenMeaning(card.meaning);
  $('listen-term').textContent = termText;
  $('listen-meaning').textContent = meaningText;
  $('listen-count').textContent = `${i+1} / ${listenQueue.length}`;
  $('listen-progress-fill').style.width = Math.round(((i+1)/listenQueue.length)*100) + '%';
}

// 콜백으로 하나씩 잇지 않고, 남은 단어 전체를 이 순간에 한꺼번에 재생목록으로 밀어넣음
// (브라우저가 "사용자가 직접 누른 순간 이후의 비동기 재생"을 막는 경우가 많아, 이 방식으로 우회)
function queueListenFrom(startIdx){
  try{
    if(!('speechSynthesis' in window)){ toast('이 기기에서는 음성 재생을 지원하지 않아요'); return; }
    window.speechSynthesis.cancel();
    if(startIdx >= listenQueue.length){
      toast('전체 다 읽었어요');
      exitListen();
      return;
    }
    const hanja = deckIsHanja(listenDeckId);
    for(let i = startIdx; i < listenQueue.length; i++){
      const card = listenQueue[i];
      const termText = hanja ? extractReading(card.meaning) : card.term;
      const meaningText = hanja ? card.term : getListenMeaning(card.meaning);
      const termLang = /^[A-Za-z\s.,'’-]+$/.test((termText||'').trim()) ? 'en-US' : 'ko-KR';

      // 단어→뜻→단어→뜻 순서로 한 세트를 두 번 반복
      for(let rep = 0; rep < 2; rep++){
        const uTerm = new SpeechSynthesisUtterance(termText);
        uTerm.lang = termLang;
        uTerm.rate = 0.9;
        if(rep === 0){
          uTerm.onstart = (idx=>()=>{ listenIdx = idx; updateListenDisplay(idx); })(i);
        }
        window.speechSynthesis.speak(uTerm);

        const uMeaning = new SpeechSynthesisUtterance(meaningText);
        uMeaning.lang = 'ko-KR';
        uMeaning.rate = 0.9;
        if(i === listenQueue.length - 1 && rep === 1){
          uMeaning.onend = ()=>{ if(listenPlaying){ toast('전체 다 읽었어요'); exitListen(); } };
        }
        window.speechSynthesis.speak(uMeaning);
      }
    }
  }catch(e){
    console.error('듣기 재생 실패', e);
    toast('재생 오류: ' + e.message);
  }
}

let wakeLock = null;

async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){
    console.warn('화면 꺼짐 방지 실패(무시 가능)', e);
  }
}
async function releaseWakeLock(){
  try{
    if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
// 잠깐 다른 앱 갔다 오는 등으로 잠금이 풀리면, 듣기 화면으로 돌아왔을 때 다시 걸어줌
document.addEventListener('visibilitychange', ()=>{

function speakText(text){
  try{
    if(!('speechSynthesis' in window)){ toast('이 기기에서는 발음 재생을 지원하지 않아요'); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    // 영어(알파벳)로만 이루어진 단어면 영어 발음, 아니면 한국어로 읽음
    utter.lang = /^[A-Za-z\s.,'’-]+$/.test(text.trim()) ? 'en-US' : 'ko-KR';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }catch(err){ console.error(err); }
}

function deckIsHanja(deckId){
  const dk = decks.find(d=>d.id===deckId);
  return !!(dk && dk.name && dk.name.startsWith('한자'));
}

function isHanjaDeck(){
  // 카드마다 출처 암기장이 다를 수 있는 "오답 모음" 세션도 지원하기 위해,
  // 카드에 붙은 _isHanja 플래그를 우선 사용하고 없으면 기존 방식(현재 열린 암기장)으로 판단
  if(currentCard && typeof currentCard._isHanja === 'boolean') return currentCard._isHanja;
  const dk = decks.find(d=>d.id===currentDeckId);
  return !!(dk && dk.name && dk.name.startsWith('한자'));
}

function extractReading(meaning){
  // "학교 교 (木, 나무목) — ..." 형태에서 앞부분 훈음만 추출
  const m = meaning.match(/^([^(—]+)/);
  return m ? m[1].trim() : meaning;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const PHASE_LABELS = {
  flip: '카드 익히기',
  quiz: '뜻 보고 단어 고르기',
  quizRev: '단어 보고 뜻 고르기',
  spell: '뜻 보고 단어 쓰기'
};

function updateProgress(){
  const pct = Math.round((studyIdx/phaseQueue.length)*100);
  $('progress-fill').style.width = pct+'%';
  $('study-count').textContent = `${studyIdx} / ${phaseQueue.length}`;
  const phase = phaseOrder[phaseIndex];
  $('phase-label').textContent = phaseOrder.length>1
    ? `${phaseIndex+1}/${phaseOrder.length} 단계 · ${PHASE_LABELS[phase]||''}`
    : '오답 다시 확인';
}

function showCard(){
  if(studyIdx >= phaseQueue.length){
    advancePhaseOrFinish();
    return;
  }
  currentCard = phaseQueue[studyIdx];
  updateProgress();
  const phase = phaseOrder[phaseIndex];
  if(phase === 'flip') showFlipStage();
  else if(phase === 'quiz') showQuizStage(false);
  else if(phase === 'quizRev') showQuizStage(true);
  else if(phase === 'spell') showSpellStage();
}

function advancePhaseOrFinish(){
  if(phaseIndex < phaseOrder.length - 1){
    phaseIndex++;
    phaseQueue = shuffle(studyQueue.map(w=>({...w})));
    studyIdx = 0;
    saveSession();
    showCard();
  } else {
    finishMainCycle();
  }
}

function showFlipStage(){
  $('stage-card').classList.remove('hidden');
  $('stage-quiz').classList.add('hidden');
  $('stage-spell').classList.add('hidden');
  $('card-term').textContent = currentCard.term;
  $('card-meaning').textContent = currentCard.meaning;
  hide('card-meaning');
  show('tap-hint');
  hide('answer-row');
  const wtag = $('wrong-tag');
  if(wrongIds.has(currentCard.id)) wtag.classList.remove('hidden'); else wtag.classList.add('hidden');
  $('flash-card').classList.remove('flip-out');
}

$('flash-card').addEventListener('click', ()=>{
  if(phaseOrder[phaseIndex]!=='flip') return;
  const meaning = $('card-meaning');
  if(meaning.classList.contains('hidden')){
    meaning.classList.remove('hidden');
    hide('tap-hint');
    show('answer-row');
  }
});

window.answerCard = function(known){
  if(!known) wrongIds.add(currentCard.id);

};

function showQuizStage(reversed){
  $('stage-card').classList.add('hidden');
  $('stage-quiz').classList.remove('hidden');
  $('stage-spell').classList.add('hidden');

  const hanja = isHanjaDeck();
  const optionTextOf = (w)=> reversed
    ? (hanja ? extractReading(w.meaning) : getReadableMeaning(w.meaning))
    : w.term;

  if(!reversed){
    $('quiz-q').textContent = hanja ? '훈음에 맞는 한자를 고르세요' : '뜻에 맞는 단어를 고르세요';
    $('quiz-term').textContent = hanja ? extractReading(currentCard.meaning) : getReadableMeaning(currentCard.meaning);
  } else {
    $('quiz-q').textContent = hanja ? '한자에 맞는 훈음을 고르세요' : '단어에 맞는 뜻을 고르세요';
    $('quiz-term').textContent = currentCard.term;
  }

  const poolCards = distractorPool.filter(w=>w.id!==currentCard.id);
  const distractorCards = shuffle(poolCards).slice(0,3);
  const allCards = shuffle([currentCard, ...distractorCards]);
  const optionTexts = allCards.map(optionTextOf);

  const wrap = $('quiz-options');
  wrap.innerHTML = '';
  const isShort = optionTexts.every(o=>o.length<=2); // 한자처럼 짧은 보기는 2x2 큰 글씨로
  wrap.className = 'quiz-options' + (isShort ? ' grid-2x2' : '');
  allCards.forEach((w,i)=>{
    const btn = document.createElement('button');
    btn.className = 'quiz-opt' + (isShort ? ' big-char' : '');
    btn.textContent = optionTexts[i];
    const isCorrect = w.id === currentCard.id;
    btn.onclick = ()=>selectQuizOption(btn, isCorrect, allCards);
    wrap.appendChild(btn);
  });
}

function selectQuizOption(btn, isCorrect, allCards){
  const buttons = Array.from($('quiz-options').children);
  buttons.forEach(b=>b.disabled = true);
  studyStats.total++;
  if(isCorrect){
    btn.classList.add('correct', 'pop-correct');
    studyStats.correct++;
    playCorrectSound();
  } else {
    btn.classList.add('wrong', 'shake-wrong');
    wrongIds.add(currentCard.id);
    const correctIdx = allCards.findIndex(w=>w.id===currentCard.id);
    if(correctIdx>=0) buttons[correctIdx].classList.add('correct', 'pop-correct');
    playWrongSound();
  }
  setTimeout(()=>{
    studyIdx++;
    saveSession();
    showCard();
  }, 700);
}

function showSpellStage(){
  $('stage-card').classList.add('hidden');
  $('stage-quiz').classList.add('hidden');
  $('stage-spell').classList.remove('hidden');
  $('spell-meaning').textContent = isHanjaDeck() ? currentCard.term : getReadableMeaning(currentCard.meaning);
  const input = $('spell-input');
  input.value = '';
  input.disabled = false;
  input.className = 'spell-input';
  $('spell-answer').textContent = '';
  hide('spell-speak-btn');
  $('spell-submit').textContent = '확인';
  $('spell-submit').onclick = submitSpell;
  show('spell-idk');
  setTimeout(()=>input.focus(), 100);
}

$('spell-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') submitSpell();
});

window.giveUpSpell = function(){
  const input = $('spell-input');
  if(input.disabled) return;
  input.disabled = true;
  input.className = 'spell-input wrong shake-wrong';
  wrongIds.add(currentCard.id);
  studyStats.total++;
  playWrongSound();
  $('spell-answer').textContent = `정답: ${isHanjaDeck() ? extractReading(currentCard.meaning) : currentCard.term}`;
  show('spell-speak-btn');
  hide('spell-idk');
  $('spell-submit').textContent = '다음';
  $('spell-submit').onclick = ()=>{
    studyIdx++;
    saveSession();
    showCard();
  };
};

window.submitSpell = function(){
  const input = $('spell-input');
  if(input.disabled) return;
  const val = input.value.trim().toLowerCase();
  if(!val){
    $('spell-answer').textContent = '답을 입력하거나, 모르면 아래 버튼을 눌러주세요';
    return;
  }
  const hanja = isHanjaDeck();
  const correctAnswer = (hanja ? extractReading(currentCard.meaning) : currentCard.term).trim().toLowerCase();
  const correct = val === correctAnswer;
  input.disabled = true;
  if(correct){
    input.className = 'spell-input correct pop-correct';
    studyStats.correct++;
    playCorrectSound();
  } else {
    input.className = 'spell-input wrong shake-wrong';
    wrongIds.add(currentCard.id);
    playWrongSound();
    $('spell-answer').textContent = `정답: ${hanja ? extractReading(currentCard.meaning) : currentCard.term}`;
  }
  studyStats.total++;
  show('spell-speak-btn');
  hide('spell-idk');
  $('spell-submit').textContent = '다음';
  $('spell-submit').onclick = ()=>{
    studyIdx++;
    saveSession();
    showCard();
  };
};

async function updateCardSchedule(card, correct){
  try{
    const targetDeckId = card._deckId || currentDeckId;
    const currentIntervalIdx = INTERVALS.indexOf(card.interval ? card.interval : 0);
    const baseIdx = currentIntervalIdx===-1 ? 0 : currentIntervalIdx;
    const { idx, days } = nextIntervalDays(baseIdx, correct);
    const nextReview = Date.now() + days*24*60*60*1000;
    await updateDoc(doc(wordsCol(targetDeckId), card.id), {
      interval: days,
      nextReview,
      wrongStreak: correct ? 0 : (card.wrongStreak||0)+1,
      lastReviewed: Date.now()
    });
  }catch(e){ console.error(e); }
}

async function finishMainCycle(){
  if(!isReviewRound){
    // 전체 카드에 대해 간격반복 스케줄을 한 번씩 갱신 (3단계를 모두 통과한 뒤 최종 결과 기준)
    for(const card of studyQueue){
      await updateCardSchedule(card, !wrongIds.has(card.id));
    }
  }
  if(!isReviewRound && wrongIds.size > 0){
    startReviewRound();
    return;
  }
  clearSession();
  showScreen('screen-done');
  const cheer = CHEER_MESSAGES[Math.floor(Math.random()*CHEER_MESSAGES.length)];
  $('done-emoji').textContent = cheer.emoji;
  $('done-title').textContent = cheer.title;
  $('done-total').textContent = studyStats.total;
  $('done-correct').textContent = studyStats.correct;
  $('done-sub').textContent = isGlobalSession
    ? '전체 오답 모음 학습을 마쳤어요'
    : `${currentDeckId ? (decks.find(d=>d.id===currentDeckId)?.name||'') : ''} 학습을 마쳤어요`;
  spawnConfetti();
  playCheerSound();
}

function startReviewRound(){
  isReviewRound = true;
  const ids = Array.from(wrongIds);
  const sourceQueue = studyQueue; // 재할당 전 원래 큐 (카드의 _isHanja/_deckId 정보 보존)
  const cards = ids.map(id=>sourceQueue.find(w=>w.id===id)).filter(Boolean);
  if(cards.length===0){ finishMainCycle(); return; }
  studyQueue = cards.map(w=>({...w}));
  phaseOrder = ['spell']; // 복습 라운드는 스펠링 확인 한 단계만 진행
  phaseIndex = 0;
  phaseQueue = shuffle(studyQueue.map(w=>({...w})));
  studyIdx = 0;
  wrongIds = new Set();
  toast(`오답 ${cards.length}개를 다시 학습해요`);
  saveSession();
  showCard();
}

// ================== Gemini API 호출 ==================
async function callGemini(parts, retry=0){
  const model = GEMINI_MODELS[geminiIdx % GEMINI_MODELS.length];
  geminiIdx++;
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': GEMINI_KEY },
      body: JSON.stringify({ contents:[{ parts }] })
    });
    const data = await res.json();
    if(data.error){
      console.warn(model, data.error.message);
      if(retry < GEMINI_MODELS.length-1) return callGemini(parts, retry+1);
      throw new Error(data.error.message);
    }
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    return text;
  }catch(e){
    if(retry < GEMINI_MODELS.length-1) return callGemini(parts, retry+1);
    throw e;
  }
}

function parseJsonArray(text){
  try{
    const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
    const start = cleaned.indexOf('[');
    const end = cleaned.lastIndexOf(']');
    if(start===-1 || end===-1) return null;
    return JSON.parse(cleaned.slice(start, end+1));
  }catch(e){
    console.error('parse fail', e);
    return null;
  }
}

// ================== escape ==================
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeHtmlAttr(str){ return escapeHtml(str); }

// ================== 초기화 ==================
goHome();
