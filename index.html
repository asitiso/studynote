<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모든암기장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3C3489">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모든암기장">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#FAF9F6;
    --card:#FFFFFF;
    --ink:#2B2A27;
    --sub:#8A8780;
    --line:#EBE8E0;
    --accent:#3C3489;
    --accent-soft:#EEEDFE;
    --good:#0F6E56;
    --good-soft:#E1F5EE;
    --bad:#993C1D;
    --bad-soft:#FAECE7;
    --warn:#854F0B;
    --warn-soft:#FAEEDA;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
    height:100%;overscroll-behavior:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* 공통 */
  .screen{flex:1;display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;border:none;background:none;color:inherit;}
  input,textarea{font-family:inherit;}

  /* 상단바 */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;}
  .topbar .title{font-size:19px;font-weight:700;color:var(--ink);}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sub);}
  .icon-btn:active{background:var(--line);}

  /* 홈: 암기장 목록 */
  .deck-list{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .deck-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
  .deck-card .left{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .deck-name{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .deck-meta{font-size:13px;color:var(--sub);}
  .deck-badge{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:6px 12px;border-radius:20px;min-width:44px;text-align:center;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
  .empty-state .big{font-size:44px;margin-bottom:12px;}
  .empty-state .msg{font-size:15px;line-height:1.6;}

  .fab{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 40px));
    display:flex;gap:10px;z-index:50;}
  .fab button{flex:1;height:56px;border-radius:18px;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .fab .primary{background:var(--accent);color:#fff;}
  .fab .secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .fab-spacer{height:90px;}

  /* 카드 뷰포트(학습화면) */
  .study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .study-deck-name{font-size:14px;color:var(--sub);font-weight:500;}
  .study-count{font-size:14px;font-weight:700;color:var(--ink);}
  .progress-track{height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .25s ease;}

  .card-stage{flex:1;display:flex;flex-direction:column;min-height:0;}
  .flash-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;min-height:320px;position:relative;transition:transform .18s ease, opacity .18s ease;}
  .flash-card.flip-out{opacity:0;transform:scale(.96);}
  .card-term{font-size:38px;font-weight:800;color:var(--ink);line-height:1.3;word-break:keep-all;}
  .card-meaning{font-size:19px;color:var(--sub);margin-top:18px;line-height:1.6;word-break:keep-all;}
  .tap-hint{position:absolute;bottom:22px;font-size:13px;color:var(--sub);opacity:.7;}
  .wrong-tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;color:var(--warn);
    background:var(--warn-soft);padding:5px 10px;border-radius:20px;}

  .answer-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .answer-row button{height:58px;border-radius:18px;font-size:17px;font-weight:700;border:1.5px solid;}
  .btn-no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);}
  .btn-yes{border-color:var(--good);color:var(--good);background:var(--good-soft);}
  .answer-row button:active{transform:scale(.97);}

  /* 4지선다 */
  .quiz-q{font-size:15px;color:var(--sub);margin-bottom:10px;font-weight:500;}
  .quiz-term{font-size:30px;font-weight:800;color:var(--ink);text-align:center;margin:26px 0 30px;word-break:keep-all;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .quiz-opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:16px 18px;font-size:16px;font-weight:600;text-align:left;color:var(--ink);}
  .quiz-opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);}
  .quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
  .quiz-opt:disabled{opacity:1;}

  /* 스펠링 입력 */
  .spell-meaning{font-size:22px;font-weight:700;color:var(--ink);text-align:center;margin:30px 0 26px;word-break:keep-all;}
  .spell-input{width:100%;height:60px;border:1.5px solid var(--line);border-radius:16px;
    font-size:22px;text-align:center;font-weight:700;padding:0 16px;background:var(--card);color:var(--ink);}
  .spell-input:focus{outline:none;border-color:var(--accent);}
  .spell-input.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);}
  .spell-input.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}
  .spell-answer{text-align:center;font-size:15px;color:var(--sub);margin-top:14px;min-height:20px;}
  .spell-submit{margin-top:18px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;}

  /* 완료 화면 */
  .done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .done-emoji{font-size:56px;margin-bottom:16px;}
  .done-title{font-size:22px;font-weight:800;margin-bottom:8px;}
  .done-sub{font-size:15px;color:var(--sub);margin-bottom:32px;}
  .done-stats{display:flex;gap:12px;margin-bottom:32px;}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 22px;min-width:90px;}
  .stat-num{font-size:24px;font-weight:800;}
  .stat-label{font-size:12px;color:var(--sub);margin-top:4px;}
  .done-btn{width:100%;max-width:280px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;}

  /* 단어 추가 화면 */
  .form-group{margin-bottom:18px;}
  .form-label{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;display:block;}
  .form-input,.form-textarea,.form-select{width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:16px;color:var(--ink);background:var(--card);}
  .form-textarea{min-height:160px;resize:vertical;line-height:1.6;}
  .form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--accent);}
  .form-hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5;}

  .method-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .method-tab{flex:1;padding:12px 10px;border-radius:14px;border:1.5px solid var(--line);
    text-align:center;font-size:14px;font-weight:700;color:var(--sub);}
  .method-tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .camera-zone{border:2px dashed var(--line);border-radius:20px;padding:40px 20px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;}
  .camera-zone .cam-icon{font-size:44px;}
  .camera-zone .cam-text{font-size:15px;color:var(--sub);line-height:1.6;}
  .cam-btn{background:var(--accent);color:#fff;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:700;}

  .preview-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .preview-item{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .preview-item input{border:none;background:transparent;font-size:15px;color:var(--ink);width:100%;padding:4px 0;}
  .preview-item input:focus{outline:none;}
  .preview-item .term-input{font-weight:700;flex:1;}
  .preview-item .meaning-input{flex:1;color:var(--sub);}
  .preview-del{color:var(--bad);font-size:20px;padding:4px 8px;flex-shrink:0;}

  .submit-bar{position:sticky;bottom:0;background:var(--bg);padding-top:14px;}
  .submit-btn{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;}
  .submit-btn:disabled{opacity:.4;}

  /* 단어 목록/편집 */
  .search-bar{margin-bottom:14px;}
  .word-row{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
    transition:transform .15s ease;}
  .word-row.swiping{transform:translateX(-70px);}
  .word-row .wt{font-weight:700;font-size:16px;}
  .word-row .wm{font-size:14px;color:var(--sub);margin-top:3px;}
  .word-del-bg{color:#fff;font-size:14px;font-weight:700;}

  .loading-overlay{position:fixed;inset:0;background:rgba(250,249,246,.92);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:14px;color:var(--sub);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .back-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .back-btn{font-size:15px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 1. 홈: 암기장 목록 ===== -->
  <div id="screen-home" class="screen">
    <div class="topbar">
      <span class="title">모든암기장</span>
    </div>
    <div id="deck-list" class="deck-list"></div>
    <div class="fab-spacer"></div>
  </div>

  <!-- ===== 2. 암기장 상세(단어 목록) ===== -->
  <div id="screen-deck" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="goHome()">‹ 목록</button>
    </div>
    <div class="topbar" style="padding-left:0;padding-right:0;">
      <span class="title" id="deck-title"></span>
      <div style="display:flex;gap:4px;">
        <button class="icon-btn" onclick="renameDeck()">✎</button>
        <button class="icon-btn" onclick="openDeleteDeck()">🗑</button>
      </div>
    </div>
    <div id="deck-session-info"></div>
    <div id="word-list"></div>
    <div class="fab-spacer"></div>
  </div>

  <!-- ===== 3. 학습(카드) 화면 ===== -->
  <div id="screen-study" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="exitStudy()">‹ 그만하기</button>
    </div>
    <div class="study-top">
      <span class="study-deck-name" id="study-deck-name"></span>
      <span class="study-count" id="study-count"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="card-stage" id="stage-card">
      <div class="flash-card" id="flash-card">
        <span class="wrong-tag hidden" id="wrong-tag">다시 복습</span>
        <div class="card-term" id="card-term"></div>
        <div class="card-meaning hidden" id="card-meaning"></div>
        <div class="tap-hint" id="tap-hint">탭해서 뜻 보기</div>
      </div>
      <div class="answer-row hidden" id="answer-row">
        <button class="btn-no" onclick="answerCard(false)">모름</button>
        <button class="btn-yes" onclick="answerCard(true)">알아요</button>
      </div>
    </div>

    <!-- 4지선다 -->
    <div class="card-stage hidden" id="stage-quiz">
      <div class="quiz-q" id="quiz-q"></div>
      <div class="quiz-term" id="quiz-term"></div>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <!-- 스펠링 입력 -->
    <div class="card-stage hidden" id="stage-spell">
      <div class="quiz-q">뜻을 보고 단어를 입력하세요</div>
      <div class="spell-meaning" id="spell-meaning"></div>
      <input class="spell-input" id="spell-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력">
      <div class="spell-answer" id="spell-answer"></div>
      <button class="spell-submit" id="spell-submit" onclick="submitSpell()">확인</button>
      <button id="spell-idk" onclick="giveUpSpell()" style="width:100%;height:48px;margin-top:10px;border-radius:14px;font-size:15px;font-weight:600;color:var(--sub);background:transparent;border:1.5px solid var(--line);">잘 모르겠어요</button>
    </div>
  </div>

  <!-- ===== 4. 완료 화면 ===== -->
  <div id="screen-done" class="screen hidden">
    <div class="done-wrap">
      <div class="done-emoji">🎉</div>
      <div class="done-title">오늘 학습 완료!</div>
      <div class="done-sub" id="done-sub"></div>
      <div class="done-stats">
        <div class="stat-box"><div class="stat-num" id="done-total" style="color:var(--accent);">0</div><div class="stat-label">학습한 단어</div></div>
        <div class="stat-box"><div class="stat-num" id="done-correct" style="color:var(--good);">0</div><div class="stat-label">맞춘 개수</div></div>
      </div>
      <button class="done-btn" onclick="goHome()">암기장 목록으로</button>
    </div>
  </div>

  <!-- ===== 5. 단어 추가 화면 ===== -->
  <div id="screen-add" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="goBackFromAdd()">‹ 취소</button>
    </div>
    <span class="title" id="add-title" style="margin-bottom:16px;display:block;">단어 추가</span>

    <div class="method-tabs">
      <div class="method-tab active" id="tab-photo" onclick="switchAddTab('photo')">📷 사진으로</div>
      <div class="method-tab" id="tab-text" onclick="switchAddTab('text')">✏️ 직접 입력</div>
    </div>

    <!-- 사진 방식 -->
    <div id="add-photo" >
      <div class="camera-zone" id="camera-zone">
        <div class="cam-icon">📷</div>
        <div class="cam-text">숙제나 교재를 촬영하면<br>AI가 자동으로 단어를 인식해요<br>여러 페이지는 "여러 장 선택"을 이용하세요</div>
        <div style="display:flex;gap:10px;">
          <button class="cam-btn" onclick="document.getElementById('photo-input-camera').click()">사진 촬영</button>
          <button class="cam-btn" style="background:var(--card);color:var(--accent);border:1.5px solid var(--accent);" onclick="document.getElementById('photo-input-gallery').click()">여러 장 선택</button>
        </div>
        <input type="file" id="photo-input-camera" accept="image/*" capture="environment" class="hidden">
        <input type="file" id="photo-input-gallery" accept="image/*" multiple class="hidden">
      </div>
    </div>

    <!-- 텍스트 방식 -->
    <div id="add-text" class="hidden">
      <div class="form-group">
        <label class="form-label">단어와 뜻을 줄바꿈으로 입력하세요</label>
        <textarea class="form-textarea" id="text-input" placeholder="achieve, 이루다&#10;consider, 고려하다&#10;apple 사과"></textarea>
        <div class="form-hint">쉼표(,) 또는 띄어쓰기로 단어와 뜻을 구분해 한 줄에 하나씩 입력하세요.</div>
      </div>
      <button class="cam-btn" style="width:100%;" onclick="parseTextInput()">단어 추출하기</button>
    </div>

    <!-- 인식 결과 미리보기 -->
    <div id="preview-wrap" class="hidden">
      <div class="form-label" style="margin-top:20px;">인식된 단어 (확인 후 저장)</div>
      <div class="preview-list" id="preview-list"></div>
      <div class="submit-bar">
        <button class="submit-btn" id="save-btn" onclick="saveWords()">전체 저장</button>
      </div>
    </div>
  </div>

  <!-- ===== 6. 암기장 만들기 (모달형 화면) ===== -->
  <div id="screen-newdeck" class="screen hidden">
    <div class="back-row">
      <button class="back-btn" onclick="goHome()">‹ 취소</button>
    </div>
    <span class="title" style="margin-bottom:20px;display:block;">새 암기장</span>
    <div class="form-group">
      <label class="form-label">암기장 이름</label>
      <input class="form-input" id="new-deck-name" placeholder="예: 중2 영단어 3과">
    </div>
    <button class="submit-btn" onclick="createDeck()">만들기</button>
  </div>

</div>

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">처리 중...</div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDocs, addDoc, deleteDoc, updateDoc,
  query, orderBy, writeBatch, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeyhQKKEnHXyGG0XpOoxP4Wp576eb8QFE",
  authDomain: "todaysell-d4bbc.firebaseapp.com",
  projectId: "todaysell-d4bbc",
  storageBucket: "todaysell-d4bbc.firebasestorage.app",

  appId: "1:582095937004:web:d1547c1e4d022e654074c9",
  measurementId: "G-WGH0FE0C5Q"
};
window.addEventListener('error', (ev)=>{
  const el = document.getElementById('deck-list');
  if(el && !el.innerHTML){
    el.innerHTML = '<div class="empty-state"><div class="big">⚠️</div><div class="msg">오류: '+ (ev.message||'') +'</div></div>';
  }
});

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

// ================== 전역 상태 ==================
let GEMINI_KEY = "AQ.Ab8RN6KlWRLYofYcVTz6mqlpboolxYOkk4yZopEJZLZNoVlZpw";
const GEMINI_MODELS = [
  'gemini-3.1-flash-lite',
  'gemini-2.5-flash-lite',
  'gemini-2.5-flash',
  'gemini-3.5-flash'
];
let geminiIdx = 0;

let decks = [];              // 암기장 목록
let currentDeckId = null;    // 현재 열람 중인 암기장
let currentWords = [];       // 현재 암기장의 단어들
let pendingPreview = [];     // 추가 대기 중인 단어 미리보기
let addTargetDeckId = null;  // 단어를 추가할 대상 암기장

// 학습 세션 상태
let studyQueue = [];   // 오늘 학습할 카드 목록
let studyIdx = 0;
let studyStage = 'flip'; // flip -> quiz -> spell

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function showScreen(id){
  ['screen-home','screen-deck','screen-study','screen-done','screen-add','screen-newdeck'].forEach(s=>{
    if(s===id) $(s).classList.remove('hidden'); else $(s).classList.add('hidden');
  });
  removeAllFabs();
}
function removeAllFabs(){
  document.querySelectorAll('.fab').forEach(el=>el.remove());
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function loading(on, text){
  if(on){ $('loading-text').textContent = text||'처리 중...'; show('loading-overlay'); }
  else hide('loading-overlay');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

// ================== Firestore 경로 ==================
// vocab/{deckId}  (deck meta)
// vocab/{deckId}/words/{wordId}

function decksCol(){ return collection(db, 'vocab'); }
function wordsCol(deckId){ return collection(db, 'vocab', deckId, 'words'); }

// ================== 암기장 목록 ==================
async function loadDecks(){
  loading(true, '불러오는 중...');
  try{
    await loadStarterDecks(); // 기본 자료 JSON은 Firestore 로딩과 별개로 항상 시도
    const snap = await getDocs(decksCol());
    decks = [];
    snap.forEach(d=>decks.push({ id:d.id, ...d.data() }));
    // 단어 개수 세기
    for(const dk of decks){
      const wsnap = await getDocs(wordsCol(dk.id));
      dk.wordCount = wsnap.size;
      let due = 0;
      const now = Date.now();
      wsnap.forEach(w=>{
        const data = w.data();
        if(!data.nextReview || data.nextReview <= now) due++;
      });
      dk.dueCount = due;
    }
    renderDeckList();
  }catch(e){
    console.error(e);
    decks = [];
    renderDeckList();
    showLoadError(e);
  }
  loading(false);
}

function showLoadError(e){
  const wrap = $('deck-list');
  const msg = (e && e.message) ? e.message : '알 수 없는 오류';
  wrap.innerHTML = `<div class="empty-state">
    <div class="big">⚠️</div>
    <div class="msg">데이터를 불러오지 못했어요.<br><br>
    <span style="font-size:12px;color:var(--bad);word-break:break-all;">${escapeHtml(msg)}</span><br><br>
    Firebase 콘솔 → Firestore → 규칙에서<br><b>vocab</b> 컬렉션 읽기/쓰기 허용을 확인해주세요.</div>
  </div>`;
  renderHomeFab();
}


// ================== 기본 제공 자료 (외부 JSON에서 로드) ==================
let STARTER_DECKS = null;   // null = 아직 로드 전, [] = 로드했지만 없음
let starterLoadFailed = false;

async function loadStarterDecks(){
  if(STARTER_DECKS !== null || starterLoadFailed) return;
  try{
    const res = await fetch('starter-decks.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    STARTER_DECKS = await res.json();
  }catch(e){
    console.warn('기본 자료 로드 실패', e);
    starterLoadFailed = true;
    STARTER_DECKS = [];
  }
}

window.addStarterDeck = async function(idx){
  const st = STARTER_DECKS[idx];
  if(!st) return;
  if(!confirm(`"${st.name}" (${st.words.length}개 카드)를 추가할까요?`)) return;
  loading(true, '기본 자료 추가 중...');
  try{
    const dref = doc(decksCol());
    await setDoc(dref, { name: st.name, createdAt: Date.now() });
    const batch = writeBatch(db);
    for(const [term, meaning] of st.words){
      const wref = doc(wordsCol(dref.id));
      batch.set(wref, { term, meaning, createdAt: Date.now(), interval:0, ease:2.3, nextReview:0, wrongStreak:0 });
    }
    await batch.commit();
    loading(false);
    toast('추가 완료');
    goHome();
  }catch(e){ console.error(e); loading(false); toast('추가 실패'); }
};

function renderStarterSection(){

    return `<div style="margin-top:22px;">
      <div class="empty-state" style="padding:24px 20px;">
        <div class="msg" style="font-size:13px;">기본 제공 자료를 불러오지 못했어요.<br>
        starter-decks.json 파일이 index.html과 같은 폴더에 있는지,<br>웹서버(또는 GitHub Pages)로 열었는지 확인해주세요.</div>
      </div>
    </div>`;
  }
  if(!STARTER_DECKS || STARTER_DECKS.length===0) return '';
  // 이미 같은 이름의 덱이 있으면 그 항목은 숨김
  const existing = new Set(decks.map(d=>d.name));
  const remain = STARTER_DECKS.map((s,i)=>({...s, idx:i})).filter(s=>!existing.has(s.name));
  if(remain.length===0) return '';
  return `<div style="margin-top:22px;">
    <div style="font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px;">기본 제공 자료</div>

      <div class="deck-card" style="margin-bottom:10px;background:var(--accent-soft);border-color:transparent;" onclick="addStarterDeck(${s.idx})">
        <div class="left">
          <div class="deck-name" style="color:var(--accent);">${escapeHtml(s.name)}</div>
          <div class="deck-meta">${s.words.length}개 카드 · 탭해서 추가</div>
        </div>
        <div class="deck-badge">+</div>
      </div>
    `).join('')}
  </div>`;
}

  currentDeckId = deckId;

  showScreen('screen-deck');
  loading(true, '단어 불러오는 중...');

function getResumableSession(deckId){
  const dk = decks.find(d=>d.id===deckId);
  const s = dk && dk.session;
  if(s && Array.isArray(s.queueIds) && s.idx < s.queueIds.length) return s;
  return null;
}

function renderDeckSessionInfo(){
  const el = $('deck-session-info');
  const session = getResumableSession(currentDeckId);
  if(!session){ el.innerHTML = ''; return; }
  el.innerHTML = `<div style="font-size:13px;color:var(--sub);margin-bottom:12px;">
    저번에 ${session.idx}/${session.queueIds.length}개까지 학습했어요.
  </div>`;
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function extractFromImages(files){
  loading(true, files.length>1 ? `AI가 사진 ${files.length}장을 인식하는 중...` : 'AI가 단어를 인식하는 중...');
  const prompt = `이 이미지는 학생의 영어 단어 숙제 또는 학습 자료입니다. 이미지가 여러 장 주어질 수 있으며, 모든 이미지를 함께 확인해 "단어(또는 개념)"와 "뜻(또는 설명)" 쌍을 전부 찾아 하나의 JSON 배열로만 반환하세요.
다른 설명, 마크다운, 코드블록 표시 없이 순수 JSON 배열만 출력하세요.
형식 예시: [{"term":"achieve","meaning":"이루다, 성취하다"},{"term":"consider","meaning":"고려하다"}]
읽기 어려운 글자는 문맥상 가장 자연스러운 단어로 추정해서 채우세요.`;

  try{
    const parts = [{ text: prompt }];
    for(const file of files){
      const base64 = await fileToBase64(file);
      parts.push({ inline_data: { mime_type: file.type || 'image/jpeg', data: base64 } });
    }
    const result = await callGemini(parts);
    const items = parseJsonArray(result);
    if(!items || items.length===0){
      loading(false);
      toast('단어를 찾지 못했어요. 다시 촬영해보세요.');
      return;
    }
    const newItems = items.map(it=>({ id: uid(), term: (it.term||'').trim(), meaning: (it.meaning||'').trim() }))
      .filter(it=>it.term && it.meaning);
    pendingPreview = pendingPreview.concat(newItems); // 기존 미리보기 목록에 이어붙임 (덮어쓰지 않음)
    loading(false);
    renderPreview();
    toast(`${newItems.length}개 인식됨 (전체 ${pendingPreview.length}개)`);
  }catch(e){
    console.error(e);
    loading(false);
    toast('인식 실패. 다시 시도해주세요.');
  }
}

window.parseTextInput = function(){
  const raw = $('text-input').value.trim();
  if(!raw){ toast('내용을 입력하세요'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  for(const line of lines){
    let term, meaning;
    if(line.includes(',')){
      const idx = line.indexOf(',');
      term = line.slice(0,idx).trim();
      meaning = line.slice(idx+1).trim();
    } else {
      const idx = line.indexOf(' ');
      if(idx===-1) continue;
      term = line.slice(0,idx).trim();
      meaning = line.slice(idx+1).trim();
    }
    if(term && meaning) items.push({ id: uid(), term, meaning });
  }
  if(items.length===0){ toast('형식을 확인해주세요 (단어, 뜻)'); return; }
  pendingPreview = pendingPreview.concat(items); // 기존 미리보기 목록에 이어붙임 (덮어쓰지 않음)
  $('text-input').value = '';
  renderPreview();
  toast(`${items.length}개 추출됨 (전체 ${pendingPreview.length}개)`);
};

function renderPreview(){

    <div class="preview-item" data-id="${it.id}">
      <input class="term-input" value="${escapeHtmlAttr(it.term)}" onchange="updatePreview('${it.id}','term',this.value)">
      <input class="meaning-input" value="${escapeHtmlAttr(it.meaning)}" onchange="updatePreview('${it.id}','meaning',this.value)">
      <button class="preview-del" onclick="removePreview('${it.id}')">✕</button>
    </div>
  `).join('');
}

window.updatePreview = function(id, field, value){
  const it = pendingPreview.find(p=>p.id===id);
  if(it) it[field] = value;
};

window.removePreview = function(id){
  pendingPreview = pendingPreview.filter(p=>p.id!==id);
  if(pendingPreview.length===0) hide('preview-wrap');
  else renderPreview();
};

window.saveWords = async function(){
  const valid = pendingPreview.filter(p=>p.term.trim() && p.meaning.trim());
  if(valid.length===0){ toast('저장할 단어가 없어요'); return; }

  // 이미 암기장에 있는 단어, 그리고 이번 배치 안의 중복은 자동으로 제외
  const existingTerms = new Set(currentWords.map(w=>w.term.trim().toLowerCase()));
  const seenInBatch = new Set();
  const toSave = [];
  let dupCount = 0;
  for(const it of valid){
    const key = it.term.trim().toLowerCase();
    if(existingTerms.has(key) || seenInBatch.has(key)){
      dupCount++;
      continue;
    }
    seenInBatch.add(key);
    toSave.push(it);
  }
  if(toSave.length===0){
    toast('전부 이미 있는 단어예요');
    return;
  }

  loading(true, '저장하는 중...');
  try{
    const batch = writeBatch(db);
    for(const it of toSave){
      const ref = doc(wordsCol(addTargetDeckId));
      batch.set(ref, {
        term: it.term.trim(),
        meaning: it.meaning.trim(),
        createdAt: Date.now(),
        interval: 0,
        ease: 2.3,
        nextReview: 0,
        wrongStreak: 0
      });
    }
    await batch.commit();
    loading(false);
    toast(dupCount>0 ? `${toSave.length}개 저장 완료 (중복 ${dupCount}개 제외)` : `${toSave.length}개 저장 완료`);
    pendingPreview = [];
    openDeck(addTargetDeckId);
  }catch(e){
    console.error(e); loading(false); toast('저장 실패');
  }
};

// ================== 간격반복(SM-2 간소화) ==================
// wrongStreak 기반 + 간단 간격: 0 -> 1일 -> 3일 -> 7일 -> 16일 -> 35일 ...
const INTERVALS = [0, 1, 3, 7, 16, 35, 60]; // days

function nextIntervalDays(currentIdx, correct){
  if(correct){
    const idx = Math.min(currentIdx+1, INTERVALS.length-1);
    return { idx, days: INTERVALS[idx] };
  } else {
    return { idx: 0, days: INTERVALS[0] };
  }
}

// ================== 학습 세션 ==================
window.startStudy = async function(deckId){
  currentDeckId = deckId;
  const dk = decks.find(d=>d.id===deckId);
  const session = getResumableSession(deckId);

  isReviewRound = false;
  wrongCardsCollected = [];

  let useResume = false;
  if(session){
    useResume = confirm(`저번에 ${session.idx}/${session.queueIds.length}개까지 학습했어요.\n\n확인: 이어서 하기\n취소: 처음부터 시작`);
  }

  if(useResume){
    const rebuilt = session.queueIds
      .map(id=>currentWords.find(w=>w.id===id))
      .filter(Boolean)
      .map(w=>({...w, wasWrong:false}));
    if(rebuilt.length > 0){
      studyQueue = rebuilt;
      studyIdx = Math.min(session.idx, studyQueue.length);
      studyStats = session.stats || { total: 0, correct: 0 };
    } else {
      useResume = false; // 저장된 단어가 모두 삭제된 경우 새로 시작
    }
  }

  if(!useResume){
    if(session) await clearSession();
    const now = Date.now();
    // 복습 대상 우선, 부족하면 새 단어로 채움
    const due = currentWords.filter(w=> !w.nextReview || w.nextReview <= now);
    const notDue = currentWords.filter(w=> w.nextReview && w.nextReview > now);
    let queue = due.slice(0, DAILY_LIMIT);
    if(queue.length < DAILY_LIMIT){
      queue = queue.concat(notDue.slice(0, DAILY_LIMIT - queue.length));
    }
    if(queue.length===0){
      toast('학습할 단어가 없어요');
      return;
    }
    studyQueue = shuffle(queue.map(w=>({...w, wasWrong:false})));
    studyIdx = 0;
    studyStats = { total: 0, correct: 0 };
  }

  $('study-deck-name').textContent = dk ? dk.name : '';
  showScreen('screen-study');
  showCard();
};

async function saveSession(){
  if(!currentDeckId) return;
  const session = {
    queueIds: studyQueue.map(w=>w.id),
    idx: studyIdx,
    stats: studyStats
  };
  try{
    await updateDoc(doc(decksCol(), currentDeckId), { session });
    const dk = decks.find(d=>d.id===currentDeckId);
    if(dk) dk.session = session;
  }catch(e){ console.error('세션 저장 실패', e); }
}

async function clearSession(){
  if(!currentDeckId) return;
  try{
    await updateDoc(doc(decksCol(), currentDeckId), { session: null });
    const dk = decks.find(d=>d.id===currentDeckId);
    if(dk) dk.session = null;
  }catch(e){ console.error('세션 초기화 실패', e); }
}

window.exitStudy = function(){
  openDeck(currentDeckId);
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function updateProgress(){
  const pct = Math.round((studyIdx/studyQueue.length)*100);
  $('progress-fill').style.width = pct+'%';
  $('study-count').textContent = `${studyIdx} / ${studyQueue.length}`;
}

function showCard(){
  if(studyIdx >= studyQueue.length){
    finishStudy();
    return;
  }
  currentCard = studyQueue[studyIdx];
  studyStage = 'flip';
  updateProgress();
  $('stage-card').classList.remove('hidden');
  $('stage-quiz').classList.add('hidden');
  $('stage-spell').classList.add('hidden');

  $('card-term').textContent = currentCard.term;
  $('card-meaning').textContent = currentCard.meaning;
  hide('card-meaning');
  show('tap-hint');
  hide('answer-row');
  const wtag = $('wrong-tag');
  if(currentCard.wasWrong) wtag.classList.remove('hidden'); else wtag.classList.add('hidden');
  const card = $('flash-card');
  card.classList.remove('flip-out');
}

$('flash-card').addEventListener('click', ()=>{
  if(studyStage!=='flip') return;
  const meaning = $('card-meaning');
  if(meaning.classList.contains('hidden')){
    meaning.classList.remove('hidden');
    hide('tap-hint');
    show('answer-row');
  }
});

window.answerCard = function(known){
  if(known){
    // 뜻 확인 단계 통과 -> 4지선다로
    goQuiz();
  } else {
    currentCard.wasWrong = true;
    goQuiz(); // 모른다고 해도 퀴즈에서 다시 기회를 줌 (재생 연습)
  }
};

function goQuiz(){
  studyStage = 'quiz';
  $('stage-card').classList.add('hidden');
  $('stage-quiz').classList.remove('hidden');

  $('quiz-q').textContent = '뜻에 맞는 단어를 고르세요';
  $('quiz-term').textContent = currentCard.meaning;

  const pool = currentWords.filter(w=>w.id!==currentCard.id).map(w=>w.term);
  const distractors = shuffle(pool).slice(0,3);
  const options = shuffle([currentCard.term, ...distractors]);

  const wrap = $('quiz-options');
  wrap.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt;
    btn.onclick = ()=>selectQuizOption(btn, opt, options);
    wrap.appendChild(btn);
  });
}

function selectQuizOption(btn, opt, allOptions){
  const buttons = Array.from($('quiz-options').children);
  buttons.forEach(b=>b.disabled = true);
  const isCorrect = opt === currentCard.term;
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    currentCard.wasWrong = true;
    buttons.find(b=>b.textContent===currentCard.term)?.classList.add('correct');
  }
  setTimeout(()=>{ goSpell(); }, 700);
}

function goSpell(){
  studyStage = 'spell';
  $('stage-quiz').classList.add('hidden');
  $('stage-spell').classList.remove('hidden');
  $('spell-meaning').textContent = currentCard.meaning;
  const input = $('spell-input');
  input.value = '';
  input.disabled = false;
  input.className = 'spell-input';
  $('spell-answer').textContent = '';
  $('spell-submit').textContent = '확인';
  $('spell-submit').onclick = submitSpell;
  show('spell-idk');
  setTimeout(()=>input.focus(), 100);
}

$('spell-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') submitSpell();
});

window.giveUpSpell = function(){
  const input = $('spell-input');
  if(input.disabled) return;
  input.disabled = true;
  input.className = 'spell-input wrong';
  currentCard.wasWrong = true;
  studyStats.total++;
  $('spell-answer').textContent = `정답: ${currentCard.term}`;
  hide('spell-idk');
  $('spell-submit').textContent = '다음';
  $('spell-submit').onclick = ()=>{
    if(!isReviewRound) updateCardSchedule(false);
    collectIfWrong();
    studyIdx++;
    saveSession();
    showCard();
  };
};

window.submitSpell = function(){
  const input = $('spell-input');
  if(input.disabled) return;
  const val = input.value.trim().toLowerCase();
  if(!val){
    $('spell-answer').textContent = '답을 입력하거나, 모르면 아래 버튼을 눌러주세요';
    return;
  }
  const answer = currentCard.term.trim().toLowerCase();
  const correct = val === answer;
  input.disabled = true;
  if(correct){
    input.className = 'spell-input correct';
    studyStats.correct++;
  } else {
    input.className = 'spell-input wrong';
    currentCard.wasWrong = true;
    $('spell-answer').textContent = `정답: ${currentCard.term}`;
  }
  studyStats.total++;
  hide('spell-idk');
  $('spell-submit').textContent = '다음';
  $('spell-submit').onclick = ()=>{
    if(!isReviewRound) updateCardSchedule(!currentCard.wasWrong);
    collectIfWrong();
    studyIdx++;
    saveSession();
    showCard();
  };
};

function collectIfWrong(){
  if(currentCard.wasWrong && !wrongCardsCollected.some(w=>w.id===currentCard.id)){
    wrongCardsCollected.push({ id: currentCard.id, term: currentCard.term, meaning: currentCard.meaning });
  }
}

async function updateCardSchedule(correct){
  try{
    const currentIntervalIdx = INTERVALS.indexOf(currentCard.interval ? currentCard.interval : 0);
    const baseIdx = currentIntervalIdx===-1 ? 0 : currentIntervalIdx;
    const { idx, days } = nextIntervalDays(baseIdx, correct);
    const nextReview = Date.now() + days*24*60*60*1000;
    await updateDoc(doc(wordsCol(currentDeckId), currentCard.id), {
      interval: days,
      nextReview,
      wrongStreak: correct ? 0 : (currentCard.wrongStreak||0)+1
    });
  }catch(e){ console.error(e); }
}

function finishStudy(){
  if(!isReviewRound && wrongCardsCollected.length > 0){
    startReviewRound();
    return;
  }
  clearSession();
  showScreen('screen-done');
  $('done-total').textContent = studyStats.total;
  $('done-correct').textContent = studyStats.correct;
  $('done-sub').textContent = `${currentDeckId ? (decks.find(d=>d.id===currentDeckId)?.name||'') : ''} 학습을 마쳤어요`;
}

function startReviewRound(){
  isReviewRound = true;
  const count = wrongCardsCollected.length;
  studyQueue = shuffle(wrongCardsCollected.map(w=>({...w, wasWrong:false})));
  wrongCardsCollected = [];
  studyIdx = 0;
  const dk = decks.find(d=>d.id===currentDeckId);
  $('study-deck-name').textContent = (dk ? dk.name : '') + ' · 오답 다시 학습';
  toast(`오답 ${count}개를 다시 학습해요`);
  showCard();
}

// ================== Gemini API 호출 ==================
async function callGemini(parts, retry=0){
  const model = GEMINI_MODELS[geminiIdx % GEMINI_MODELS.length];
  geminiIdx++;
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': GEMINI_KEY },
      body: JSON.stringify({ contents:[{ parts }] })
    });
    const data = await res.json();
    if(data.error){
      console.warn(model, data.error.message);
      if(retry < GEMINI_MODELS.length-1) return callGemini(parts, retry+1);
      throw new Error(data.error.message);
    }
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    return text;
  }catch(e){
    if(retry < GEMINI_MODELS.length-1) return callGemini(parts, retry+1);
    throw e;
  }
}

function parseJsonArray(text){
  try{
    const cleaned = text.replace(/```json/g,'').replace(/```/g,'').trim();
    const start = cleaned.indexOf('[');
    const end = cleaned.lastIndexOf(']');
    if(start===-1 || end===-1) return null;
    return JSON.parse(cleaned.slice(start, end+1));
  }catch(e){
    console.error('parse fail', e);
    return null;
  }
}

// ================== escape ==================
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeHtmlAttr(str){ return escapeHtml(str); }

// ================== 초기화 ==================
goHome();
